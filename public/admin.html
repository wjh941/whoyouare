<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>发码台 · 你是谁测试所</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --border: #e5e7eb; --border-strong: #d4d4d8;
    --text: #18181b; --muted: #71717a; --faint: #a1a1aa;
    --primary: #18181b; --primary-hover: #2d2d33;
    --ok: #059669; --ok-bg: #ecfdf5; --warn: #b45309; --warn-bg: #fffbeb;
    --bad: #dc2626; --bad-bg: #fef2f2; --link: #2563eb;
    --radius: 12px; --radius-sm: 8px;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 64px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .brand h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: .01em; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .head-right { display: flex; align-items: center; gap: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--bad); }

  /* ---------- cards & layout ---------- */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

  .series { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .series-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .series-name { font-size: 15px; font-weight: 600; }
  .series-goods { color: var(--muted); font-size: 12.5px; }
  .stats { display: flex; gap: 10px; }
  .stat { flex: 1; background: var(--bg); border-radius: var(--radius-sm); padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat.avail b.warn { color: var(--warn); } .stat.avail b.zero { color: var(--bad); }
  .stat.avail b.good { color: var(--ok); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- buttons & inputs ---------- */
  .btn {
    appearance: none; border: 1px solid transparent; border-radius: var(--radius-sm);
    background: var(--primary); color: #fff; font: inherit; font-weight: 500;
    padding: 8px 14px; cursor: pointer; transition: background .15s ease;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
  .btn.ghost:hover { background: var(--bg); }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  input[type="password"], input[type="text"], input[type="number"], select, textarea {
    width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: #fff; color: var(--text); font: inherit; padding: 9px 11px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--text); }
  label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 5px; }
  .field { margin-bottom: 14px; }

  /* ---------- panels ---------- */
  .panel { margin-top: 16px; padding: 18px 20px; }
  .panel h2 { font-size: 13.5px; font-weight: 600; margin: 0 0 10px; color: var(--muted); letter-spacing: .02em; }
  .log-list { margin: 0; padding: 0; list-style: none; }
  .log-list li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 12.8px; }
  .log-list li:last-child { border-bottom: 0; }
  .log-time { color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .log-act { min-width: 3.2em; font-weight: 500; }
  .log-act.gen { color: var(--link); } .log-act.send { color: var(--ok); }
  .log-act.tpl { color: var(--warn); } .log-act.reg { color: var(--link); }
  .empty { color: var(--faint); font-size: 12.5px; padding: 6px 0; }

  /* ---------- gate ---------- */
  .gate { max-width: 380px; margin: 12vh auto 0; padding: 28px; }
  .gate h1 { font-size: 17px; margin: 0 0 4px; }
  .gate p { color: var(--muted); font-size: 12.8px; margin: 0 0 18px; }
  .gate .err { color: var(--bad); font-size: 12.5px; min-height: 1.2em; margin: 10px 0 0; }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(24,24,27,.42); display: none;
    align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; z-index: 50;
  }
  .overlay.on { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 520px; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .modal h3 { margin: 0 0 4px; font-size: 15.5px; }
  .modal .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; }
  .modal .row { display: flex; gap: 10px; }
  .modal .row > * { flex: 1; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .code-big {
    font-family: var(--mono); font-size: 19px; font-weight: 600; letter-spacing: .06em;
    background: var(--bg); border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
    padding: 13px 14px; text-align: center; user-select: all; margin-bottom: 12px;
  }
  .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .note.warn { color: var(--warn); }
  textarea.tplbox { min-height: 190px; resize: vertical; font-size: 13px; line-height: 1.7; }
  .codes-box {
    font-family: var(--mono); font-size: 12.5px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; max-height: 200px; overflow: auto; user-select: all; white-space: pre;
  }
  .sent-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .sent-item:last-child { border-bottom: 0; }
  .sent-code { font-family: var(--mono); font-size: 12.5px; flex: 1; user-select: all; }
  .sent-time { color: var(--faint); font-size: 11.5px; white-space: nowrap; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(16px);
    background: var(--primary); color: #fff; font-size: 13px; padding: 9px 16px;
    border-radius: 99px; opacity: 0; pointer-events: none; transition: all .22s ease; z-index: 99;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ==================== 登录门 ==================== -->
<div class="wrap">
  <div class="card gate" id="gate">
    <h1>发码台</h1>
    <p>输入管理密钥(ADMIN_KEY,配置在 Vercel 环境变量)。密钥只保存在本机浏览器。</p>
    <div class="field">
      <label for="gateKey">管理密钥</label>
      <input type="password" id="gateKey" placeholder="ADMIN_KEY" autocomplete="current-password" />
    </div>
    <button class="btn" id="gateBtn" style="width:100%">进入发码台</button>
    <div class="err" id="gateErr"></div>
  </div>

  <!-- ==================== 主界面 ==================== -->
  <div id="main" class="hidden">
    <header>
      <div class="brand">
        <h1>你是谁测试所 · 发码台</h1>
        <p>生成即入库,取码即发货 —— 不碰脚本,不碰部署</p>
      </div>
      <div class="head-right">
        <span class="dot" id="connDot" title="服务端连接状态"></span>
        <button class="btn ghost sm" id="refreshBtn">刷新</button>
        <button class="btn ghost sm" id="logoutBtn">退出</button>
      </div>
    </header>

    <div class="grid" id="seriesGrid"><!-- 系列卡片 JS 渲染 --></div>

    <div class="card panel">
      <h2>最近操作</h2>
      <ul class="log-list" id="logList"><li class="empty">加载中…</li></ul>
    </div>
  </div>
</div>

<!-- ==================== 弹窗:生成 ==================== -->
<div class="overlay" id="mGen">
  <div class="modal">
    <h3>生成补码 · <span id="genSeriesName"></span></h3>
    <p class="sub">服务端直接生成并入库,无需脚本、无需重新部署。</p>
    <div class="row">
      <div class="field"><label for="genCount">数量(1–100)</label>
        <input type="number" id="genCount" min="1" max="100" value="10" /></div>
      <div class="field"><label for="genLen">码长</label>
        <select id="genLen">
          <option value="16" selected>16 位(推荐)</option>
          <option value="20">20 位</option>
          <option value="24">24 位</option>
        </select></div>
    </div>
    <div id="genResult" class="hidden"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="genClose">关闭</button>
      <button class="btn" id="genGo">生成</button>
    </div>
  </div>
</div>

<!-- ==================== 弹窗:取码发货 ==================== -->
<div class="overlay" id="mTake">
  <div class="modal">
    <h3>取码发货 · <span id="takeSeriesName"></span></h3>
    <p class="sub">已从库存取出一个码并记入发货流水;话术可临时改,改完再复制。</p>
    <div class="code-big" id="takeCode">—</div>
    <textarea class="tplbox" id="takeMsg" spellcheck="false"></textarea>
    <div class="modal-foot">
      <button class="btn ghost" id="takeClose">关闭</button>
      <button class="btn" id="takeCopy">复制发货话术</button>
    </div>
  </div>
</div>

<!-- ==================== 弹窗:模板 ==================== -->
<div class="overlay" id="mTpl">
  <div class="modal">
    <h3>发货话术模板 · <span id="tplSeriesName"></span></h3>
    <p class="sub">占位符:{code} = 兑换码,{商品} = 商品名。保存在服务端,换设备也在。</p>
    <textarea class="tplbox" id="tplText" spellcheck="false"></textarea>
    <div class="modal-foot">
      <button class="btn ghost" id="tplReset">恢复默认</button>
      <button class="btn ghost" id="tplClose">取消</button>
      <button class="btn" id="tplSave">保存</button>
    </div>
  </div>
</div>

<!-- ==================== 弹窗:待发货 / 发货记录 ==================== -->
<div class="overlay" id="mList">
  <div class="modal">
    <h3 id="listTitle">列表</h3>
    <p class="sub" id="listSub"></p>
    <div id="listBody"></div>
    <div class="modal-foot"><button class="btn ghost" id="listClose">关闭</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict'
// ---------------------------------------------------------------------------
// 配置
// ---------------------------------------------------------------------------
const API = '/api/admin'
const KEY_STORE = 'wy_bench_key_v1'
const SERIES = [
  { id: 'hid', prefix: 'HY', name: '隐藏人格', goods: '隐藏人格·完整版报告' },
  { id: 'cf',  prefix: 'CF', name: '穿越暴富', goods: '暴富时间表·完整版' },
  { id: 'rl',  prefix: 'RL', name: '关系反应炉', goods: '关系反应炉·双人合盘报告', tag: '新' },
  { id: 'da',  prefix: 'DA', name: '43号档案', goods: '第43号档案·完整观察报告', tag: '新' },
]
const DEFAULT_TPL = '您好～您的「{商品}」兑换码：\n{code}\n\n使用方法：\n1️⃣ 建议用手机浏览器打开测试链接——微信里直接打开答题一般没问题，但如遇页面打不开/解锁失败：点右上角「···」选「在浏览器打开」（或复制链接到浏览器），码不会失效\n2️⃣ 测完进入结果页，点「输入兑换码解锁完整版」\n3️⃣ 粘贴上面的码即可，一次解锁永久有效\n\n有任何问题随时找我～'
const ACT_NAME = { gen: '生成补码', send: '发货', tpl: '改模板', reg: '脚本注册' }

// ---------------------------------------------------------------------------
// 工具
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id)
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
let KEY = ''
let TPL_CACHE = {}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on')
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('on'), 1700)
}
function fmtTime(ts) {
  const d = new Date(ts)
  const p = n => String(n).padStart(2, '0')
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`
}
function copyText(text, msg) {
  const done = () => toast(msg || '已复制')
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done))
  } else fallbackCopy(text, done)
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea'); ta.value = text
  ta.style.position = 'fixed'; ta.style.opacity = '0'
  document.body.appendChild(ta); ta.select()
  try { document.execCommand('copy'); done() } catch (e) { toast('复制失败,请手动选择') }
  ta.remove()
}
function openModal(id) { $(id).classList.add('on') }
function closeModal(id) { $(id).classList.remove('on') }

// ---------------------------------------------------------------------------
// API
// ---------------------------------------------------------------------------
async function api(action, payload) {
  let res
  try {
    res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY },
      body: JSON.stringify(Object.assign({ action }, payload || {})),
    })
  } catch (e) { throw new Error('网络错误,请检查连接') }
  if (res.status === 401) { logout(); throw new Error('密钥不对,已退出') }
  const data = await res.json().catch(() => ({}))
  if (!res.ok) {
    const MAP = {
      server_verification_disabled: 'KV 未配置:去 Vercel 项目 → Storage 创建 KV,并配置 ADMIN_KEY',
      no_stock: '库存空了,先「生成补码」',
      admin_not_configured: '服务端还没配 ADMIN_KEY 环境变量',
      template_missing_code_placeholder: '模板里必须有 {code} 占位符',
      too_many_requests: '操作太频繁,稍等一分钟',
    }
    throw new Error(MAP[data.error] || ('请求失败(' + res.status + ')'))
  }
  return data
}

// ---------------------------------------------------------------------------
// 登录 / 退出
// ---------------------------------------------------------------------------
function logout() {
  KEY = ''
  try { localStorage.removeItem(KEY_STORE) } catch (e) { /* ignore */ }
  $('gate').classList.remove('hidden')
  $('main').classList.add('hidden')
}
async function tryLogin(key, silent) {
  KEY = key
  $('gateErr').textContent = ''
  $('gateBtn').disabled = true
  try {
    await api('ping')
    try { localStorage.setItem(KEY_STORE, key) } catch (e) { /* ignore */ }
    $('gate').classList.add('hidden')
    $('main').classList.remove('hidden')
    $('connDot').className = 'dot on'
    await refresh()
  } catch (e) {
    if (String(e.message).indexOf('密钥不对') === -1 && !$('main').classList.contains('hidden')) {
      $('connDot').className = 'dot off'
    }
    if (!silent) $('gateErr').textContent = e.message
    if (String(e.message).indexOf('密钥不对') >= 0) KEY = ''
  } finally {
    $('gateBtn').disabled = false
  }
}

// ---------------------------------------------------------------------------
// 系列卡片与库存
// ---------------------------------------------------------------------------
const state = {}

function renderCards() {
  $('seriesGrid').innerHTML = SERIES.map(s => `
    <div class="card series" data-id="${s.id}">
      <div class="series-head">
        <div>
          <div class="series-name">${esc(s.name)} <span style="color:var(--faint);font-weight:400">(${s.prefix})</span>
            ${s.tag ? `<span style="font-size:10.5px;background:var(--ok-bg);color:var(--ok);border-radius:99px;padding:1px 8px;margin-left:4px;vertical-align:2px">${s.tag}</span>` : ''}</div>
          <div class="series-goods">${esc(s.goods)}</div>
        </div>
        <button class="btn ghost sm" data-act="tpl" data-id="${s.id}">模板</button>
      </div>
      <div class="stats">
        <div class="stat avail"><b id="avail-${s.id}">–</b><span>待发货库存</span></div>
        <div class="stat"><b id="act-${s.id}">–</b><span>已激活</span></div>
        <div class="stat"><b id="reg-${s.id}">–</b><span>累计注册</span></div>
      </div>
      <div class="actions">
        <button class="btn" data-act="take" data-id="${s.id}">取码发货</button>
        <button class="btn ghost" data-act="gen" data-id="${s.id}">生成补码</button>
        <button class="btn ghost sm" data-act="sent" data-id="${s.id}">发货记录</button>
        <button class="btn ghost sm" data-act="avail" data-id="${s.id}">待发明细</button>
      </div>
    </div>`).join('')
}

async function refresh() {
  try {
    const inv = await api('inventory')
    for (const s of SERIES) {
      const d = (inv.series && inv.series[s.id]) || {}
      const avail = d.avail || 0
      const el = $('avail-' + s.id)
      el.textContent = avail
      el.className = avail === 0 ? 'zero' : (avail <= 5 ? 'warn' : 'good')
      $('act-' + s.id).textContent = d.activated != null ? d.activated : '–'
      $('reg-' + s.id).textContent = d.registered != null ? d.registered : '–'
      state[s.id] = d
    }
    $('connDot').className = 'dot on'
    const log = await api('log')
    renderLog(log.items || [])
  } catch (e) {
    if (String(e.message).indexOf('网络错误') >= 0) $('connDot').className = 'dot off'
    toast(e.message)
  }
}

function renderLog(items) {
  if (!items.length) { $('logList').innerHTML = '<li class="empty">还没有操作记录</li>'; return }
  $('logList').innerHTML = items.map(it => {
    const s = SERIES.find(x => x.id === it.series)
    const detail = it.act === 'gen' ? `入库 ${it.n} 个`
      : it.act === 'send' ? `${esc(it.code || '')} 已标记发货`
      : it.act === 'tpl' ? '更新发货话术'
      : '其他操作'
    return `<li><span class="log-time">${fmtTime(it.ts || 0)}</span>
      <span class="log-act ${esc(it.act || '')}">${ACT_NAME[it.act] || '操作'}</span>
      <span>${s ? esc(s.name) : ''} · ${detail}</span></li>`
  }).join('')
}

// ---------------------------------------------------------------------------
// 生成
// ---------------------------------------------------------------------------
let genSeries = null
function openGen(id) {
  genSeries = id
  const s = SERIES.find(x => x.id === id)
  $('genSeriesName').textContent = `${s.name}(${s.prefix})`
  $('genResult').classList.add('hidden')
  $('genResult').innerHTML = ''
  $('genGo').classList.remove('hidden')
  openModal('mGen')
}
async function doGen() {
  const count = Math.max(1, Math.min(100, parseInt($('genCount').value, 10) || 10))
  const length = parseInt($('genLen').value, 10) || 16
  $('genGo').disabled = true
  try {
    const r = await api('generate', { series: genSeries, count, length })
    const box = $('genResult')
    box.classList.remove('hidden')
    box.innerHTML = `<div class="note warn">✅ 已入库 <b>${r.created}</b> 个${r.duplicated ? `(重复跳过 ${r.duplicated})` : ''}。明文码已存入服务端库存,用「取码发货」逐个发出即可——这里不再整屏展示明文,更安全。</div>`
    $('genGo').classList.add('hidden')
    refresh()
  } catch (e) { toast(e.message) }
  $('genGo').disabled = false
}

// ---------------------------------------------------------------------------
// 取码发货
// ---------------------------------------------------------------------------
let takeSeries = null
async function openTake(id) {
  takeSeries = id
  const s = SERIES.find(x => x.id === id)
  $('takeSeriesName').textContent = `${s.name}(${s.prefix})`
  $('takeCode').textContent = '取码中…'
  $('takeMsg').value = ''
  openModal('mTake')
  try {
    const tpl = TPL_CACHE[id] || (await api('template_get', { series: id })).template
    TPL_CACHE[id] = tpl
    const r = await api('take', { series: id })
    $('takeCode').textContent = r.code
    $('takeMsg').value = r.message || tpl.split('{code}').join(r.code)
    refresh()
  } catch (e) {
    $('takeCode').textContent = '—'
    $('takeMsg').value = e.message
    toast(e.message)
  }
}

// ---------------------------------------------------------------------------
// 模板
// ---------------------------------------------------------------------------
let tplSeries = null
async function openTpl(id) {
  tplSeries = id
  const s = SERIES.find(x => x.id === id)
  $('tplSeriesName').textContent = `${s.name}(${s.prefix})`
  $('tplText').value = '加载中…'
  openModal('mTpl')
  try {
    const r = await api('template_get', { series: id })
    $('tplText').value = r.template
    TPL_CACHE[id] = r.template
  } catch (e) { $('tplText').value = DEFAULT_TPL; toast(e.message) }
}

// ---------------------------------------------------------------------------
// 待发明细 / 发货记录
// ---------------------------------------------------------------------------
async function openAvail(id) {
  const s = SERIES.find(x => x.id === id)
  $('listTitle').textContent = `待发明细 · ${s.name}`
  $('listSub').textContent = '这些明文码在服务端库存里,尚未发出。仅自己查看,不要截图外传。'
  $('listBody').innerHTML = '<div class="empty">加载中…</div>'
  openModal('mList')
  try {
    const r = await api('avail_list', { series: id })
    const codes = r.codes || []
    $('listBody').innerHTML = codes.length
      ? `<div class="codes-box">${esc(codes.join('\n'))}</div>
         <div class="modal-foot"><button class="btn sm" id="copyAvail">复制全部(${codes.length})</button></div>`
      : '<div class="empty">库存为空</div>'
    const btn = $('copyAvail')
    if (btn) btn.onclick = () => copyText(codes.join('\n'), '已复制全部待发码')
  } catch (e) { $('listBody').innerHTML = `<div class="empty">${esc(e.message)}</div>` }
}
async function openSent(id) {
  const s = SERIES.find(x => x.id === id)
  $('listTitle').textContent = `发货记录 · ${s.name}`
  $('listSub').textContent = '最近 50 条;买家说没收到就点「重发」,同码同话术。'
  $('listBody').innerHTML = '<div class="empty">加载中…</div>'
  openModal('mList')
  try {
    const r = await api('sent_list', { series: id })
    const items = r.items || []
    $('listBody').innerHTML = items.length ? items.map((it, i) => `
      <div class="sent-item">
        <span class="sent-code">${esc(it.code)}</span>
        <span class="sent-time">${fmtTime(it.ts)}</span>
        <button class="btn ghost sm" data-resend="${i}">重发</button>
      </div>`).join('') : '<div class="empty">还没有发货记录</div>'
    if (items.length) {
      const tpl = TPL_CACHE[id] || (await api('template_get', { series: id })).template
      TPL_CACHE[id] = tpl
      $('listBody').querySelectorAll('[data-resend]').forEach(btn => {
        btn.onclick = () => {
          const it = items[Number(btn.dataset.resend)]
          const msg = tpl.split('{code}').join(it.code).split('{商品}').join(s.goods)
          copyText(msg, '已复制:同码同话术,去私信粘贴')
        }
      })
    }
  } catch (e) { $('listBody').innerHTML = `<div class="empty">${esc(e.message)}</div>` }
}

// ---------------------------------------------------------------------------
// 事件绑定
// ---------------------------------------------------------------------------
$('gateBtn').onclick = () => tryLogin($('gateKey').value.trim(), false)
$('gateKey').addEventListener('keydown', e => { if (e.key === 'Enter') $('gateBtn').click() })
$('logoutBtn').onclick = logout
$('refreshBtn').onclick = refresh

$('seriesGrid').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]')
  if (!btn) return
  const id = btn.dataset.id
  if (btn.dataset.act === 'take') openTake(id)
  if (btn.dataset.act === 'gen') openGen(id)
  if (btn.dataset.act === 'tpl') openTpl(id)
  if (btn.dataset.act === 'avail') openAvail(id)
  if (btn.dataset.act === 'sent') openSent(id)
})

$('genGo').onclick = doGen
$('genClose').onclick = () => closeModal('mGen')
$('takeClose').onclick = () => closeModal('mTake')
$('takeCopy').onclick = () => {
  const msg = $('takeMsg').value
  if (!msg) return
  copyText(msg, '已复制发货话术,去私信粘贴')
}
$('tplSave').onclick = async () => {
  try {
    await api('template_set', { series: tplSeries, template: $('tplText').value })
    TPL_CACHE[tplSeries] = $('tplText').value
    toast('模板已保存(服务端)')
    closeModal('mTpl')
  } catch (e) { toast(e.message) }
}
$('tplReset').onclick = () => { $('tplText').value = DEFAULT_TPL }
$('tplClose').onclick = () => closeModal('mTpl')
$('listClose').onclick = () => closeModal('mList')

// 弹窗点遮罩关闭
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('on') })
})
// Esc 关闭全部弹窗
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.overlay.on').forEach(ov => ov.classList.remove('on'))
})

// ---------------------------------------------------------------------------
// 启动
// ---------------------------------------------------------------------------
renderCards()
let saved = ''
try { saved = localStorage.getItem(KEY_STORE) || '' } catch (e) { /* ignore */ }
if (saved) tryLogin(saved, true)
</script>
</body>
</html>
